{% if page_obj.has_other_pages %}<nav class="d-flex align-items-center gap-3 mt-3" aria-label="Pages">
{% if page_obj.has_previous %}<a class="btn btn-outline-secondary btn-sm" href="?page={{ page_obj.previous_page_number }}{% if statut_selectionne %}&amp;statut={{ statut_selectionne }}{% endif %}">Précédent</a>{% endif %}
<span>Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="btn btn-outline-secondary btn-sm" href="?page={{ page_obj.next_page_number }}{% if statut_selectionne %}&amp;statut={{ statut_selectionne }}{% endif %}">Suivant</a>{% endif %}
</nav>{% endif %}
