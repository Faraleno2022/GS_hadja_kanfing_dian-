{% extends 'base.html' %}
{% block title %}{{ titre_page }}{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0"><i class="fas fa-book text-primary me-2"></i>{{ titre_page }}</h2>
        <a href="{% url 'depenses:catalogue_livres' %}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Retour au catalogue</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Code du livre</label>
                        <input type="text" name="code_livre" class="form-control" value="{{ livre.code_livre|default:code_suggere }}" {% if livre %}readonly{% endif %}>
                        <div class="form-text">Généré automatiquement si laissé tel quel.</div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Titre *</label>
                        <input type="text" name="titre" class="form-control" required value="{{ livre.titre|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Auteur *</label>
                        <input type="text" name="auteur" class="form-control" required value="{{ livre.auteur|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Catégorie *</label>
                        <div class="input-group">
                            <select name="categorie" class="form-select" required>
                                <option value="">— Choisir —</option>
                                {% for c in categories %}
                                <option value="{{ c.id }}" {% if livre and livre.categorie_id == c.id %}selected{% endif %}>{{ c.nom }}</option>
                                {% endfor %}
                            </select>
                            <a href="{% url 'depenses:gestion_categories_livres' %}" class="btn btn-outline-primary" title="Gérer les catégories"><i class="fas fa-plus"></i></a>
                        </div>
                        {% if not categories %}<div class="form-text text-danger">Aucune catégorie. <a href="{% url 'depenses:gestion_categories_livres' %}">Créez-en une d'abord</a>.</div>{% endif %}
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ISBN</label>
                        <input type="text" name="isbn" class="form-control" value="{{ livre.isbn|default:'' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Éditeur</label>
                        <input type="text" name="editeur" class="form-control" value="{{ livre.editeur|default:'' }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Année</label>
                        <input type="number" name="annee_publication" class="form-control" value="{{ livre.annee_publication|default:'' }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Langue</label>
                        <input type="text" name="langue" class="form-control" value="{{ livre.langue|default:'Français' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nombre d'exemplaires</label>
                        <input type="number" name="nombre_exemplaires" min="1" class="form-control" value="{{ livre.nombre_exemplaires|default:1 }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">État</label>
                        <select name="etat" class="form-select">
                            {% for val, lib in etat_choices %}
                            <option value="{{ val }}" {% if livre and livre.etat == val %}selected{% elif not livre and val == 'BON' %}selected{% endif %}>{{ lib }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Emplacement (rayon)</label>
                        <input type="text" name="emplacement" class="form-control" value="{{ livre.emplacement|default:'' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nb pages</label>
                        <input type="number" name="nombre_pages" class="form-control" value="{{ livre.nombre_pages|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mots-clés</label>
                        <input type="text" name="mots_cles" class="form-control" value="{{ livre.mots_cles|default:'' }}" placeholder="séparés par des virgules">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Couverture (image)</label>
                        <input type="file" name="couverture" accept="image/*" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Résumé</label>
                        <textarea name="resume" class="form-control" rows="3">{{ livre.resume|default:'' }}</textarea>
                    </div>
                </div>
                <div class="mt-3 text-end">
                    <a href="{% url 'depenses:catalogue_livres' %}" class="btn btn-outline-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
