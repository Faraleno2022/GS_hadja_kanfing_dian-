{% extends 'base.html' %}
{% block content %}<div class="container py-4"><h1>{{ titre_page }}</h1>
<form method="get" class="d-flex gap-2 my-3"><label for="date">Date</label><input class="form-control" type="date" id="date" name="date" value="{{ date_selectionnee|date:'Y-m-d' }}"><button class="btn btn-primary">Afficher</button></form>
<p id="presence-message" role="status" aria-live="polite"></p>
<table class="table"><thead><tr><th>Élève</th><th>Classe</th><th>Présence</th></tr></thead><tbody>
{% for a in abonnements %}<tr><td>{{ a.eleve.nom_complet }}</td><td>{{ a.eleve.classe }}</td><td>
<form method="post" action="{% url 'abonnements:enregistrer_presence' %}" class="presence-form">{% csrf_token %}
<input type="hidden" name="abonnement_id" value="{{ a.pk }}"><input type="hidden" name="date" value="{{ date_selectionnee|date:'Y-m-d' }}">
<select name="present" class="form-select" aria-label="Présence de {{ a.eleve.nom_complet }}"><option value="false" {% if not a.presence_jour.present %}selected{% endif %}>Absent</option><option value="true" {% if a.presence_jour.present %}selected{% endif %}>Présent</option></select>
<button class="btn btn-outline-primary mt-1">Enregistrer</button></form></td></tr>{% empty %}<tr><td colspan="3">Aucun abonnement actif à cette date.</td></tr>{% endfor %}</tbody></table></div>
<script>
document.querySelectorAll('.presence-form').forEach(form => form.addEventListener('submit', async event => {
 event.preventDefault(); const button=form.querySelector('button'); button.disabled=true;
 const message=document.getElementById('presence-message');
 try { const response=await fetch(form.action,{method:'POST',body:new FormData(form),credentials:'same-origin'}); const data=await response.json();
 if(!response.ok || !data.success) throw new Error(data.error || 'Enregistrement refusé.');
 message.textContent=data.message;
 } catch(error) {message.textContent=error.message || 'Connexion indisponible.';} finally {button.disabled=false;}
}));
</script>{% endblock %}
