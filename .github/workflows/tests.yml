name: Tests du projet
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: github-actions-test-only
      DJANGO_DEBUG: "true"
      TWILIO_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les bibliothèques système
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation
      - name: Installer les dépendances Python
        run: python -m pip install -r requirements.txt
      - name: Vérifier les migrations
        run: python scripts/run_project_tests.py --schema
      - name: Exécuter les tests isolés
        run: python scripts/run_project_tests.py
      - name: Auditer les dependances installees
        run: |
          python -m pip list --format=freeze --exclude pip --exclude setuptools --exclude wheel > "$RUNNER_TEMP/application-requirements.txt"
          python -m pip install --target "$RUNNER_TEMP/security-tools" pip-audit==2.10.1
          PYTHONPATH="$RUNNER_TEMP/security-tools" python -m pip_audit -r "$RUNNER_TEMP/application-requirements.txt" --no-deps --disable-pip --progress-spinner off
